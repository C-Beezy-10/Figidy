<title>Figidy — Break The Habit, Not The Planet</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f3f0e8;
        color: #17231b;
    }

    /* NAVIGATION */
    header {
        width: 100%;
        padding: 28px 6%;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .logo {
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -1.5px;
    }

    nav a {
        text-decoration: none;
        color: #17231b;
        font-size: 15px;
        font-weight: 600;
        margin-left: 30px;
    }

    /* HERO */
    .hero {
        min-height: calc(100vh - 90px);
        padding: 40px 6% 80px;

        display: flex;
        align-items: center;
        justify-content: space-between;

        gap: 40px;
    }

    .hero-text {
        width: 45%;
        max-width: 600px;
        z-index: 2;
    }

    .eyebrow {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #66816a;
        margin-bottom: 22px;
    }

    .hero-text h1 {
        font-size: clamp(55px, 7vw, 100px);
        line-height: 0.92;
        letter-spacing: -5px;
        margin-bottom: 30px;
    }

    .hero-text h1 span {
        color: #65856a;
    }

    .hero-text p {
        max-width: 500px;
        font-size: 20px;
        line-height: 1.6;
        color: #59635c;
        margin-bottom: 35px;
    }

    .cta {
        display: inline-block;
        padding: 17px 32px;
        border-radius: 100px;

        background: #17231b;
        color: #ffffff;

        text-decoration: none;
        font-size: 16px;
        font-weight: 700;

        transition: transform 0.2s ease, background 0.2s ease;
    }

    .cta:hover {
        transform: translateY(-3px);
        background: #314639;
    }

    /* PRODUCT IMAGE */
    .product-container {
        width: 55%;
        min-height: 650px;

        display: flex;
        align-items: center;
        justify-content: center;

        position: relative;
    }

    .product-container::before {
        content: "";
        position: absolute;

        width: 520px;
        height: 520px;

        border-radius: 50%;

        background: #dfe4d8;

        z-index: 0;
    }

    .product-container img {
        position: relative;
        z-index: 1;

        width: min(650px, 100%);
        max-height: 720px;

        object-fit: contain;

        display: block;

        filter: drop-shadow(0 25px 30px rgba(0, 0, 0, 0.12));

        transition: transform 0.4s ease;
    }

    .product-container img:hover {
        transform: scale(1.03);
    }
```
